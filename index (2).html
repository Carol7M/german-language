var DB_URL = "https://soma-deutsch-default-rtdb.firebaseio.com"; // e.g. https://soma-deutsch-default-rtdb.firebaseio.com
var REMOTE = DB_URL.indexOf("https://") === 0;
var encK = function(k){ return String(k).replace(/[.#$/\[\]]/g, "_"); };
window.storage = {
  async get(key, shared){
    if (shared && REMOTE) {
      const r = await fetch(DB_URL + "/soma/" + encK(key) + ".json");
      if (!r.ok) throw new Error("fetch failed");
      const v = await r.json();
      if (v == null) throw new Error("not found");
      return { key, value: typeof v === "string" ? v : JSON.stringify(v), shared: true };
    }
    const v = localStorage.getItem("soma:" + key);
    if (v == null) throw new Error("not found");
    return { key, value: v, shared: !!shared };
  },
  async set(key, value, shared){
    if (shared && REMOTE) {
      await fetch(DB_URL + "/soma/" + encK(key) + ".json", { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(value) });
      return { key, value, shared: true };
    }
    localStorage.setItem("soma:" + key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    if (shared && REMOTE) {
      await fetch(DB_URL + "/soma/" + encK(key) + ".json", { method: "DELETE" });
      return { key, deleted: true, shared: true };
    }
    localStorage.removeItem("soma:" + key);
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared){
    if (shared && REMOTE) {
      const r = await fetch(DB_URL + "/soma.json?shallow=true");
      if (!r.ok) throw new Error("fetch failed");
      const obj = (await r.json()) || {};
      const keys = Object.keys(obj).filter(k => k.indexOf(prefix || "") === 0);
      return { keys, prefix, shared: true };
    }
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf("soma:" + (prefix || "")) === 0) keys.push(k.slice(5));
    }
    return { keys, prefix, shared: !!shared };
  },
};
</script>

/* Clock time engine: German colloquial time (halb looks FORWARD!) */
const HW12 = ["zwölf", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun", "zehn", "elf"];
const hw = (h) => HW12[h % 12];
const timeDe = (h, m) => {
    const nx = hw(h + 1);
    if (m === 0)
        return "Punkt " + hw(h);
    if (m === 5)
        return "fünf nach " + hw(h);
    if (m === 10)
        return "zehn nach " + hw(h);
    if (m === 15)
        return "Viertel nach " + hw(h);
    if (m === 20)
        return "zehn vor halb " + nx;
    if (m === 25)
        return "fünf vor halb " + nx;
    if (m === 30)
        return "halb " + nx;
    if (m === 35)
        return "fünf nach halb " + nx;
    if (m === 40)
        return "zehn nach halb " + nx;
    if (m === 45)
        return "Viertel vor " + nx;
    if (m === 50)
        return "zehn vor " + nx;
    return "fünf vor " + nx; // m === 55
};
const timeWhy = (h, m) => {
    const nx = hw(h + 1), nxN = (h % 12) + 1;
    if (m === 0)
        return h + ":00 is exactly on the hour — Punkt / genau / gleich " + hw(h) + ".";
    if (m === 30)
        return "German „halb“ looks FORWARD to the next hour: halb " + nx + " = halfway TO " + nxN + " = " + h + ":30!";
    if (m === 15)
        return "Viertel nach " + hw(h) + " = a quarter PAST " + (h % 12 || 12) + ".";
    if (m === 45)
        return "Viertel vor " + nx + " = a quarter TO the NEXT hour (" + nxN + ").";
    if (m === 20 || m === 25)
        return "Close to the half: count BACK from halb " + nx + " — " + (30 - m) + " minutes before it.";
    if (m === 35 || m === 40)
        return "Past the half: count FORWARD from halb " + nx + " — " + (m - 30) + " minutes after it.";
    if (m < 30)
        return m + " minutes past → " + (m === 5 ? "fünf" : "zehn") + " nach " + hw(h) + ".";
    return (60 - m) + " minutes to the next hour → " + (60 - m === 5 ? "fünf" : "zehn") + " vor " + nx + ".";
};
